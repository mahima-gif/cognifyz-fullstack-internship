<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SecureTasks</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto 0.75rem auto; width: 44px; height: 44px; font-size: 1.25rem;">ST</div>
        <h1>Welcome Back</h1>
        <p>Sign in to manage your private tasks securely</p>
      </div>

      <!-- Server / Form Error Alert Box -->
      <div id="form-alert" style="display: none; background-color: var(--danger-bg); border-left: 4px solid var(--danger); color: var(--danger-text); padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.875rem;"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
          <div class="form-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
          <div class="form-error" id="password-error"></div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
          Sign In
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
        <span class="text-muted">Don't have an account?</span>
        <a href="/register.html">Create an account</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
