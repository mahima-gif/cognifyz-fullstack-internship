<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ProfileHub - Advanced Single Page Application with Complex Form Validation, Real-Time DOM Manipulation, and HTML5 History Routing." />
  <title>ProfileHub - Single Page Application</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>
  <!-- Global Application Shell -->
  <div class="app-layout">
    <!-- Sticky Navigation Bar -->
    <header class="site-header">
      <div class="nav-container">
        <a href="/" class="brand-logo" data-link aria-label="ProfileHub Home">
          <span class="brand-icon">⚡</span>
          <span class="brand-text">Profile<span class="brand-accent">Hub</span></span>
        </a>

        <!-- Mobile Navigation Hamburger -->
        <button
          type="button"
          id="mobile-nav-toggle"
          class="mobile-nav-toggle"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Toggle navigation menu"
        >
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
        </button>

        <!-- Main Navigation Links -->
        <nav id="nav-menu" class="nav-menu" aria-label="Primary Navigation">
          <ul class="nav-list">
            <li>
              <a href="/" class="nav-link" data-link>Home</a>
            </li>
            <li>
              <a href="/register" class="nav-link" data-link>Register</a>
            </li>
            <li>
              <a href="/dashboard" class="nav-link" data-link>Dashboard</a>
            </li>
            <li>
              <a href="/about" class="nav-link" data-link>About</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Main Content Area (Dynamic SPA Views Mount Here) -->
    <main id="app" class="main-container" role="main" tabindex="-1">
      <!-- Views rendered dynamically by client-side router -->
    </main>

    <!-- Site Footer -->
    <footer class="site-footer">
      <div class="footer-container">
        <p class="footer-text">
          <strong>ProfileHub</strong> • Cognifyz Technologies Full Stack Internship (Level 2: Intermediate • Task 4)
        </p>
        <p class="footer-subtext">
          Built with pure Vanilla JavaScript (ES Modules), HTML5 History API, and CSS Custom Properties.
        </p>
      </div>
    </footer>
  </div>

  <!-- Toast Notification Root Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
